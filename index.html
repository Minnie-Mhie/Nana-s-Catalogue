<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classroom CORS Test</title>
</head>
<body>
    <h2>CORS Null Origin Test</h2>

    <!-- 1. The Button -->
    <button id="exploreCollections">Run CORS Test</button>
    
    <div id="output" style="margin-top: 15px;">Status: Idle</div>

    <!-- 2. The Sandboxed Iframe (with the target script inside srcdoc) -->
    <iframe sandbox="allow-scripts" style="display:none;" srcdoc="
        <script>
            // Listen for the 'trigger' message sent from the main page
            window.addEventListener('message', function(event) {
                if (event.data === 'trigger') {
                    // Send cross-origin request (Origin will be 'null')
                    fetch('http://localhost:3000/api/user-data', {
                        method: 'GET',
                        credentials: 'include'
                    })
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP status ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        // Pass success data back to top window
                        window.top.postMessage({ status: 'success', data: data }, '*');
                    })
                    .catch(err => {
                        // Pass error back to top window
                        window.top.postMessage({ status: 'error', error: err.message }, '*');
                    });
                }
            });
        <\/script>
    "></iframe>

    <!-- 3. Your Classroom Script + Main Window Listener -->
    <script>
        // Listen for results coming back from the iframe
        window.addEventListener('message', function(event) {
            // Ignore the 'trigger' message sent to itself
            if (event.data === 'trigger') return;

            const output = document.getElementById('output');
            if (event.data.status === 'success') {
                const result = 'Success! Data retrieved:\n' + JSON.stringify(event.data.data, null, 2);
                output.innerText = result;
                alert(result);
            } else if (event.data.status === 'error') {
                const errResult = 'Failed: ' + event.data.error;
                output.innerText = errResult;
                alert(errResult);
            }
        });

        // --- CLASSROOM SCRIPT ---
        function triggerFrame() {
            const iframe = document.querySelector('iframe[sandbox]');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage('trigger', '*');
            }
        }

        const button = document.getElementById("exploreCollections");
        if (button) {
            button.addEventListener("click", triggerFrame);
        }
    </script>
</body>
</html>
